# Public repo: Cloudflare Workers static assets.
#   PR from a branch in THIS repo  -> Worker Preview (URL commented on the PR)
#   push to main (= Patrick merged)-> production deploy to https://fondue.specdlc.com
#   PR closed                      -> preview deleted
#   manual run on main             -> production deploy (use once after enabling deploys)
# Fork PRs never get secrets (pull_request, not pull_request_target).
# Off until the repo variable CLOUDFLARE_DEPLOY_ENABLED is "true" (Patrick flips it).
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are SpecDLC organization Actions secrets
# selected for SpecDLC/fondue, SpecDLC/onemileahead, and SpecDLC/tandem.
# GitHub does not scope them to an environment. Any job in those repositories can read them.
# environment: preview adds Patrick as a required reviewer on the jobs that set it.
# environment: production has no required reviewer. Merging to main is the production approval.
# Wrangler can print banner or warning lines around --json output, so the preview step
# extracts the URL tolerantly and never fails the job just because the output is not JSON.
name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:          # manual production deploy of main (e.g. right after enabling deploys)

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER: wrangler@4.151.2   # exact 4.x; `wrangler preview` and `wrangler preview delete` are supported

jobs:
  preview:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Build the page
        run: ./build.sh && cp dist/fondue-demo.html dist/index.html
      - id: preview
        name: Create or update Worker Preview
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-preview.log"
          npx --yes "$WRANGLER" preview --name "pr-${{ github.event.pull_request.number }}" --json > "$log" 2>&1 || {
            cat "$log"; echo "wrangler preview failed"; exit 1; }
          cat "$log"
          # Prefer the JSON field; fall back to the first https URL in the output.
          url="$(jq -er '.preview.urls[0]' "$log" 2>/dev/null \
            || sed -n '/^[[:space:]]*{/,$p' "$log" | jq -er '.preview.urls[0]' 2>/dev/null \
            || grep -Eo 'https://[A-Za-z0-9._/-]+\.workers\.dev[A-Za-z0-9._/-]*' "$log" | head -n1 \
            || true)"
          if [ -z "$url" ]; then
            echo "::warning::Preview uploaded but no URL could be read from wrangler output."
            url="(URL not reported; see the Deploy run log)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment the preview URL
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --edit-last --create-if-none \
            --body "Preview for review: ${{ steps.preview.outputs.url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Delete the Worker Preview (a preview that was never made, or is already gone, is fine)
        run: |
          set -uo pipefail
          out="$(npx --yes "$WRANGLER" preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            if printf '%s' "$out" | grep -qE 'Preview not found|code: 10025'; then echo "No preview to delete for this PR."; exit 0; fi
            exit "$rc"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production        # merging to main is already the approval to deploy; do not add a required reviewer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Build the page
        run: ./build.sh && cp dist/fondue-demo.html dist/index.html
      - run: npx --yes "$WRANGLER" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
