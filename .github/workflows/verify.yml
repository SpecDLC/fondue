# Public repo: defense in depth. Every PR (release PRs and outside contributions) is re-scanned,
# then the engine is tested and the demo page is built.
name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (pinned + checksum)
        env:
          V: 8.30.1
          SHA: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          f="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/$f"
          echo "${SHA}  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1
      - name: Rust toolchain from rust-toolchain.toml (adds wasm32-unknown-unknown)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Build (seed, tests, WASM, smoke test, page)
        run: ./build.sh
